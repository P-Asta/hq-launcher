name: Publish Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - '*'
  workflow_dispatch:

env:
  APP_NAME: "hq-launcher"

permissions:
  contents: write
  

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build changelog
        id: build_changelog
        run: |
          PREV_TAG=$(git tag --list v* | tail -n2 | head -n1)
          echo "changelog=$(git log $PREV_TAG...${{ github.ref_name }} --pretty=format:"- %s")" >> $GITHUB_OUTPUT

    outputs:
      changelog: ${{ steps.build_changelog.outputs.changelog }}

  release:
    needs: [changelog]
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: '-- --locked'
            targets: 'x86_64-pc-windows-gnu'
          - platform: windows-latest
            args: '-- --locked'
            targets: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg -- --locked'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

    env:
      CI: true
      GOOGLE_LCSTATS_CLIENT_ID: ${{ secrets.GOOGLE_LCSTATS_CLIENT_ID }}
      GOOGLE_LCSTATS_CLIENT_SECRET: ${{ secrets.GOOGLE_LCSTATS_CLIENT_SECRET }}
      GOOGLE_LCSTATS_PICKER_API_KEY: ${{ secrets.GOOGLE_LCSTATS_PICKER_API_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Enable pinned Yarn
        run: |
          npm install --global corepack@0.33.0 --force
          corepack enable
          yarn --version

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.targets }}

      - name: Install MinGW (Linux cross-compile)
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt install -y mingw-w64

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Ubuntu dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y libfuse2t64 || sudo apt install -y libfuse2
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            xdg-utils \
            libglib2.0-bin \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: yarn install --immutable

      - name: Check Tauri JS and Rust versions
        run: node scripts/check-tauri-versions.mjs

      # =========================
      # 🔹 BRANCH CI (tauri ❌)
      # =========================
      - name: Frontend Build (branch only)
        if: ${{ github.ref_type == 'branch' }}
        run: yarn build

      - name: Test macOS backend (branch only)
        if: ${{ github.ref_type == 'branch' && matrix.platform == 'macos-latest' }}
        working-directory: src-tauri
        run: |
          cargo test --locked --lib
          cargo check --locked --target x86_64-apple-darwin

      # =========================
      # 🔹 TAG RELEASE (tauri ✅)
      # =========================
      - name: Debug signing key (safe)
        if: ${{ github.ref_type == 'tag' }}
        run: |
          echo "TAURI KEY LENGTH: ${#TAURI_SIGNING_PRIVATE_KEY}"

      - name: Build & Release Tauri App
        if: ${{ github.ref_type == 'tag' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: ${{ matrix.platform == 'ubuntu-latest' && '1' || '' }}
          NO_STRIP: ${{ matrix.platform == 'ubuntu-latest' && 'true' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "${{ env.APP_NAME }} v__VERSION__"
          releaseBody: |
            ${{ needs.changelog.outputs.changelog }}

            See the assets to download this version and install.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
